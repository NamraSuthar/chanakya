<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In - Dwaar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }

        .form-box {
            border: 1px solid #ccc;
            padding: 30px;
            border-radius: 4px;
        }

        h1 {
            margin-bottom: 20px;
            font-size: 24px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input[type="email"],
        input[type="password"],
        input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 10px;
            background: black;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background: #333;
        }

        .error {
            color: red;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .success {
            color: green;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .footer {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }

        .footer a {
            color: black;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="form-box">
            <h1>Sign In to Dwaar</h1>

            <div id="error" class="error"></div>
            <div id="success" class="success"></div>

            <form id="loginForm" method="post" action="/o/authenticate/sign-in">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input id="email" name="email" type="email" required />
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input id="password" name="password" type="password" required />
                </div>

                <input type="hidden" id="client_id" name="client_id" />
                <input type="hidden" id="redirect_uri" name="redirect_uri" />
                <input type="hidden" id="state" name="state" />
                <input type="hidden" id="nonce" name="nonce" />
                <input type="hidden" id="code_challenge" name="code_challenge" />
                <input type="hidden" id="code_challenge_method" name="code_challenge_method" />

                <button type="submit">Sign In</button>
            </form>

            <div class="footer">
                Don't have an account? <a id="signupLink" href="/signup">Create one</a>
            </div>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const errorDiv = document.getElementById("error");

        // Validate required parameters
        const clientId = params.get("client_id");
        const redirectUri = params.get("redirect_uri");

        if (!clientId || !redirectUri) {
            errorDiv.textContent = "Invalid request: missing client_id or redirect_uri";
            document.getElementById("loginForm").style.display = "none";
        }

        document.getElementById("client_id").value = clientId || "";
        document.getElementById("redirect_uri").value = redirectUri || "";
        document.getElementById("state").value = params.get("state") || "";
        document.getElementById("nonce").value = params.get("nonce") || "";
        document.getElementById("code_challenge").value = params.get("code_challenge") || "";
        document.getElementById("code_challenge_method").value = params.get("code_challenge_method") || "";

        // Update signup link to preserve params
        const signupLink = document.getElementById("signupLink");
        if (signupLink) {
            signupLink.setAttribute("href", "/signup" + window.location.search);
        }

        // Handle form submission errors
        document.getElementById("loginForm").addEventListener("submit", async (e) => {
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            if (!email || !password) {
                e.preventDefault();
                errorDiv.textContent = "Email and password are required";
            }
        });
    </script>
</body>

</html>
