<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In</title>
</head>

<body>
    <h1>Sign In</h1>

    <form id="loginForm" method="post" action="/o/authenticate/sign-in">
        <div>
            <label for="email">Email</label>
            <input id="email" name="email" type="email" required />
        </div>

        <div>
            <label for="password">Password</label>
            <input id="password" name="password" type="password" required />
        </div>

        <input type="hidden" id="client_id" name="client_id" />
        <input type="hidden" id="redirect_uri" name="redirect_uri" />
        <input type="hidden" id="state" name="state" />
        <input type="hidden" id="nonce" name="nonce" />
<input type="hidden" id="code_challenge" name="code_challenge" />
<input type="hidden" id="code_challenge_method" name="code_challenge_method" />

        <button type="submit">Sign In</button>
    </form>

    <pre id="result"></pre>

    <script>

        const params = new URLSearchParams(window.location.search)


        document.getElementById("client_id").value = params.get("client_id") || "";
        document.getElementById("redirect_uri").value = params.get("redirect_uri") || "";
        document.getElementById("state").value = params.get("state") || "";
        document.getElementById("nonce").value = params.get("nonce") || "";
        document.getElementById("code_challenge").value = params.get("code_challenge") || "";
        document.getElementById("code_challenge_method").value = params.get("code_challenge_method") || "";


</script>
</body>

</html>
