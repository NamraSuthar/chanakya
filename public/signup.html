<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up - Dwaar</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 400px;
      padding: 20px;
    }

    .form-box {
      border: 1px solid #ccc;
      padding: 30px;
      border-radius: 4px;
    }

    h1 {
      margin-bottom: 20px;
      font-size: 24px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }

    input[type="email"],
    input[type="password"],
    input[type="text"] {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
    }

    button {
      width: 100%;
      padding: 10px;
      background: black;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      background: #333;
    }

    .error {
      color: red;
      font-size: 14px;
      margin-bottom: 15px;
    }

    .success {
      color: green;
      font-size: 14px;
      margin-bottom: 15px;
    }

    .footer {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
    }

    .footer a {
      color: black;
      text-decoration: none;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    #result {
      margin-top: 15px;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      background: #f9f9f9;
      font-size: 12px;
      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="form-box">
      <h1>Create Account</h1>

      <div id="error" class="error"></div>
      <div id="success" class="success"></div>

      <form id="signupForm">
        <div class="form-group">
          <label for="firstName">First Name</label>
          <input id="firstName" name="firstName" type="text" required />
        </div>

        <div class="form-group">
          <label for="lastName">Last Name</label>
          <input id="lastName" name="lastName" type="text" />
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" required />
        </div>

        <div class="form-group">
          <label for="password">Password (min 8 chars)</label>
          <input id="password" name="password" type="password" required />
        </div>

        <button type="submit">Create Account</button>
      </form>

      <div id="result"></div>

      <div class="footer">
        Already have an account? <a href="/o/authenticate">Sign in</a>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById("signupForm");
    const result = document.getElementById("result");
    const errorDiv = document.getElementById("error");
    const successDiv = document.getElementById("success");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const firstName = document.getElementById("firstName").value.trim();
      const lastName = document.getElementById("lastName").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      // Validation
      if (!firstName) {
        errorDiv.textContent = "First name is required";
        return;
      }

      if (!email) {
        errorDiv.textContent = "Email is required";
        return;
      }

      if (!password || password.length < 8) {
        errorDiv.textContent = "Password must be at least 8 characters";
        return;
      }

      try {
        errorDiv.textContent = "";
        const response = await fetch("/o/authenticate/sign-up", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            firstName,
            lastName: lastName || null,
            email,
            password
          })
        });

        const data = await response.json();

        if (response.ok) {
          successDiv.textContent = "Account created successfully! Redirecting to login...";
          form.reset();
          setTimeout(() => {
            window.location.href = "/authenticate";
          }, 2000);
        } else {
          errorDiv.textContent = data.message || "Sign up failed";
          result.textContent = JSON.stringify(data, null, 2);
        }
      } catch (error) {
        errorDiv.textContent = "Error: " + error.message;
      }
    });
  </script>
</body>
</html>
